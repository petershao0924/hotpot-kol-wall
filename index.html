<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>火鍋燒肉季 網紅貼文牆</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: peach hero → sticky filter bar → fixed-column masonry (4/3/2/1 cols). Palette follows 呼叫KOL: orange #FF700C on white/peach. */
:root{
  --bg:#FFFFFF; --peach:#FFF0E5; --surface:#FFFFFF; --ink:#333132; --muted:#6B747B; --line:#E5E7EB;
  --orange:#FF700C; --orange-deep:#E85F00; --orange-soft:#FFE3CF; --violet:#594CDA; --violet-soft:#ECEAFB;
  --shadow:0 1px 2px rgba(51,49,50,.06),0 8px 22px rgba(255,112,12,.08);
  --f-display:"Open Sans","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-body:"Open Sans","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17181A; --peach:#26201B; --surface:#212225; --ink:#F2F1F0; --muted:#A3AAB0; --line:#34363A;
  --orange:#FF8A3D; --orange-deep:#FF700C; --orange-soft:#3A2618; --violet:#9C93F0; --violet-soft:#26244A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.25); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#17181A; --peach:#26201B; --surface:#212225; --ink:#F2F1F0; --muted:#A3AAB0; --line:#34363A;
  --orange:#FF8A3D; --orange-deep:#FF700C; --orange-soft:#3A2618; --violet:#9C93F0; --violet-soft:#26244A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.25); color-scheme:dark }

body{background:var(--bg);color:var(--ink);font-family:var(--f-body);line-height:1.55;-webkit-text-size-adjust:100%}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.hero{background:linear-gradient(180deg,var(--peach),var(--bg))}
.hero .wrap{padding-block:44px 28px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--orange)}
.eyebrow .kol{width:26px;height:26px;object-fit:contain;flex:none}
h1{font-family:var(--f-display);font-weight:900;font-size:clamp(28px,5vw,48px);line-height:1.15;margin:10px 0 10px;text-wrap:balance}
h1 em{font-style:normal;color:var(--orange)}
.sub{color:var(--muted);max-width:60ch;margin:0}
.stats{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 18px;min-width:112px}
.stat b{display:block;font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--ink)}
.stat span{font-size:12px;color:var(--muted)}
.stat.hl b{color:var(--orange)}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;flex-direction:column;gap:10px;padding-block:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin;padding-bottom:4px;min-width:0;-webkit-overflow-scrolling:touch}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 12px 4px 5px;font:600 13px var(--f-body);cursor:pointer;white-space:nowrap}
.chip.all{padding-left:12px}
.chip small{color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--orange);color:#fff;border-color:var(--orange)}
.chip[aria-pressed="true"] small{color:#fff;opacity:.85}
.seg{display:inline-flex;border:1px solid var(--orange);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;color:var(--orange);padding:6px 14px;font:600 13px var(--f-body);cursor:pointer;white-space:nowrap}
.seg button+button{border-left:1px solid var(--orange)}
.seg button[aria-pressed="true"]{background:var(--orange);color:#fff}
#q{flex:1 1 180px;min-width:0;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 14px;font:14px var(--f-body)}
.count{font-size:13px;color:var(--muted);margin-left:auto;font-variant-numeric:tabular-nums}
.chip:focus-visible,.seg button:focus-visible,input:focus-visible,a:focus-visible,.top:focus-visible{outline:2px solid var(--violet);outline-offset:2px}

main .wrap{padding-block:24px 64px}
.wall{display:flex;gap:16px;align-items:flex-start}
.col{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.ph{position:relative;display:grid;place-items:center;text-decoration:none;background:linear-gradient(160deg,var(--orange-soft),var(--peach))}
.ph.post{aspect-ratio:4/5}
.ph.reel{aspect-ratio:9/14}
.ph .tag{position:absolute;top:10px;left:10px;font:700 11px var(--f-body);letter-spacing:.06em;color:#fff;background:var(--orange);padding:3px 9px;border-radius:999px}
.ph .tile{width:44%;max-width:120px;aspect-ratio:1;border-radius:20px;background:#fff;box-shadow:0 8px 22px rgba(255,112,12,.18);overflow:hidden;display:grid;place-items:center}
.ph .tile img{width:100%;height:100%;object-fit:cover}
.ph .tile.txt{font:900 40px var(--f-display);color:#333132}
.ph .play{position:absolute;bottom:12px;right:12px;width:36px;height:36px;border-radius:50%;background:var(--orange);display:grid;place-items:center}
.ph .play::after{content:"";border-left:11px solid #fff;border-top:7px solid transparent;border-bottom:7px solid transparent;margin-left:3px}
.embed{min-height:120px}
.embed .instagram-media{margin:0!important;min-width:0!important;width:100%!important;max-width:100%!important;border:0!important;border-radius:0!important;box-shadow:none!important}
.meta{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px}
.brand{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.brand b{font:800 16px var(--f-display)}
.lg{flex:none;border-radius:50%;object-fit:cover;background:#fff;box-shadow:0 0 0 1px var(--line)}
.chip .lg{width:22px;height:22px}
.brand .lg{width:30px;height:30px}
.co{font-size:11px;font-weight:700;color:var(--violet);background:var(--violet-soft);padding:2px 8px;border-radius:999px}
.who{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.links{display:flex;gap:6px}
.btn{font:700 12px var(--f-body);text-decoration:none;border-radius:999px;padding:6px 12px;border:1px solid var(--orange);color:var(--orange);background:var(--surface)}
.btn.ig{background:var(--orange);color:#fff}
.empty{text-align:center;color:var(--muted);padding:60px 0}
.note{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px;margin-top:24px}
.top{position:fixed;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(env(safe-area-inset-bottom,0px) + 16px);width:46px;height:46px;border-radius:50%;border:0;background:var(--orange);color:#fff;font:800 18px var(--f-display);box-shadow:0 6px 18px rgba(255,112,12,.35);cursor:pointer;z-index:6}

/* phone */
@media (max-width:640px){
  .hero .wrap{padding-block:28px 18px}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .stat{min-width:0;padding:10px 12px}
  .stat b{font-size:22px}
  .bar{position:static}
  .row{gap:6px}
  .seg button{padding:6px 11px}
  #q{flex-basis:100%;order:3}
  .count{order:4;margin-left:0}
  main .wrap{padding-block:16px 80px}
  .wall,.col{gap:14px}
}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
</style>
</head>

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const logoImg=r=>LOGOS[r]?`<img class="lg" src="${LOGOS[r]}" alt="" loading="lazy">`:"";

const POSTS=[];
RAW.forEach(([r,co,list])=>list.forEach(([who,path,fb])=>{
  const type=path.startsWith("reel")?"reel":"post";
  const code=path.split("/")[1];
  POSTS.push({r,co:!!co,key:(co?"酪農協會／":"")+r,who,type,code,url:`https://www.instagram.com/${type==="reel"?"reel":"p"}/${code}/`,fb});
}));

const state={brand:"all",type:"all",co:"all",q:""};
let EMBED=false;

function stats(){
  const brands=new Set(POSTS.map(p=>p.key)).size;
  const people=new Set(POSTS.map(p=>p.who.toLowerCase())).size;
  const reels=POSTS.filter(p=>p.type==="reel").length;
  const posts=POSTS.length-reels;
  $("#stats").innerHTML=[[brands,"合作餐廳"],[people,"參與網紅"],[POSTS.length,"上線內容",1],[posts,"圖文貼文"],[reels,"Reels 影片"]]
    .map(([n,l,h])=>`<div class="stat${h?" hl":""}"><b>${n}</b><span>${l}</span></div>`).join("");
}

function chips(){
  const counts={};POSTS.forEach(p=>counts[p.key]=(counts[p.key]||0)+1);
  $("#chips").innerHTML=`<button type="button" class="chip all" data-k="all" aria-pressed="true">全部餐廳<small>${POSTS.length}</small></button>`+
    Object.keys(counts).map(k=>`<button type="button" class="chip" data-k="${esc(k)}" aria-pressed="false">${logoImg(k.replace("酪農協會／",""))}${esc(k)}<small>${counts[k]}</small></button>`).join("");
}

// cards are built once and reused, so filtering or resizing never duplicates or reloads more than needed
function buildCard(p){
  const el=document.createElement("article");el.className="card";
  el.innerHTML=`<div class="vis"></div>
    <div class="meta">
      <div class="brand">${logoImg(p.r)}<b>${esc(p.r)}</b>${p.co?'<span class="co">酪農協會</span>':""}</div>
      <div class="who">@ ${esc(p.who)}</div>
      <div class="links"><a class="btn ig" href="${p.url}" target="_blank" rel="noopener">看 IG ${p.type==="reel"?"Reels":"圖文"}</a>${p.fb?`<a class="btn" href="${p.fb}" target="_blank" rel="noopener">FB</a>`:""}</div>
    </div>`;
  p.el=el;p.vis=el.querySelector(".vis");p.loaded=false;
  paintVisual(p);
}
function paintVisual(p){
  if(EMBED){p.vis.className="vis embed";p.vis.innerHTML="";return}
  p.vis.className="vis";
  p.vis.innerHTML=`<a class="ph ${p.type}" href="${p.url}" target="_blank" rel="noopener" aria-label="開啟 ${esc(p.who)} 的 Instagram ${p.type==="reel"?"Reels":"圖文"}">
      <span class="tag">${p.type==="reel"?"REELS":"圖文"}</span>
      ${LOGOS[p.r]?`<span class="tile"><img src="${LOGOS[p.r]}" alt=""></span>`:`<span class="tile txt">${esc([...p.r][0])}</span>`}
      ${p.type==="reel"?'<span class="play"></span>':""}
    </a>`;
}

const colCount=()=>{const w=$("#wall").clientWidth;return w>=1080?4:w>=780?3:w>=520?2:1};
let lastCols=0,lastList=[];
let io=null;
function observe(p){
  if(!EMBED||p.loaded)return;
  io.observe(p.vis);
}
function layout(list,force){
  const n=colCount();
  if(!force&&n===lastCols&&list.length===lastList.length&&list.every((p,i)=>p===lastList[i]))return;
  lastCols=n;lastList=list;
  const wall=$("#wall");wall.textContent="";
  const cols=[...Array(n)].map(()=>{const c=document.createElement("div");c.className="col";wall.appendChild(c);return c});
  const h=new Array(n).fill(0);
  // place each card in the currently shortest column (estimated heights), in order, so nothing reflows between columns later
  list.forEach(p=>{
    const i=h.indexOf(Math.min(...h));
    cols[i].appendChild(p.el);
    h[i]+=p.type==="reel"?1.7:1.45;
    observe(p);
  });
}

function filtered(){
  const q=state.q.trim().toLowerCase();
  return POSTS.filter(p=>(state.brand==="all"||p.key===state.brand)&&(state.type==="all"||p.type===state.type)&&(state.co==="all"||(state.co==="milk")===p.co)&&(!q||p.who.toLowerCase().includes(q)));
}
function render(force){
  const list=filtered();
  layout(list,force);
  $("#empty").hidden=list.length>0;
  $("#count").textContent=`顯示 ${list.length} / ${POSTS.length} 則`;
}

function pressGroup(container,btn){container.querySelectorAll("[aria-pressed]").forEach(b=>b.setAttribute("aria-pressed",b===btn?"true":"false"))}
$("#chips").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;pressGroup($("#chips"),b);state.brand=b.dataset.k;render()});
$("#typeSeg").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;pressGroup($("#typeSeg"),b);state.type=b.dataset.v;render()});
$("#coSeg").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;pressGroup($("#coSeg"),b);state.co=b.dataset.v;render()});
$("#q").addEventListener("input",e=>{state.q=e.target.value;render()});
let rt;addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(()=>{if(colCount()!==lastCols)render(true)},150)});
addEventListener("scroll",()=>{$("#top").hidden=scrollY<800},{passive:true});
$("#top").addEventListener("click",()=>scrollTo({top:0}));

POSTS.forEach(buildCard);
stats();chips();render(true);

// On a normal website Instagram's embed script loads and cards switch to real posts; in a sandbox it fails quietly and the logo cards stay.
(function tryEmbed(){
  const s=document.createElement("script");s.async=true;s.src="https://www.instagram.com/embed.js";
  s.onload=()=>{
    if(!window.instgrm)return;
    EMBED=true;$("#note").hidden=true;
    io=new IntersectionObserver(es=>{
      let any=false;
      es.forEach(e=>{
        if(!e.isIntersecting)return;
        const p=POSTS.find(x=>x.vis===e.target);io.unobserve(e.target);
        if(!p||p.loaded)return;p.loaded=true;any=true;
        e.target.innerHTML=`<blockquote class="instagram-media" data-instgrm-permalink="${p.url}" data-instgrm-version="14"><a href="${p.url}" target="_blank" rel="noopener">在 Instagram 查看</a></blockquote>`;
      });
      if(any){try{window.instgrm.Embeds.process()}catch(_){}}
    },{rootMargin:"600px 0px"});
    POSTS.forEach(paintVisual);
    render(true);
  };
  document.head.appendChild(s);
})();
</script>
